name: Build Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop, main]

jobs:
  build-pages:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servicios-elpaisano-expo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: servicios-elpaisano-expo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Expo app
        run: npm run lint

      - name: Typecheck Expo app
        run: npm run typecheck

      - name: Export Expo web build
        run: npm run build:pages
