name: Build Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop, main]

jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pages
        run: npm run build:pages